<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Seans</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A2F45"/>
      <stop offset="1" stop-color="#171A28"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F7CFF"/>
      <stop offset="0.55" stop-color="#6A5CFF"/>
      <stop offset="1" stop-color="#9B5CF6"/>
    </linearGradient>
    <linearGradient id="people" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C3C8DA"/>
      <stop offset="1" stop-color="#8A90A8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#7B6CFF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7B6CFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#5B4BFF" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#glow)"/>

  <!-- Screen -->
  <rect x="96" y="104" width="320" height="212" rx="36" fill="url(#screen)" filter="url(#shadow)"/>
  <rect x="96" y="104" width="320" height="106" rx="36" fill="#FFFFFF" opacity="0.08"/>

  <!-- Play button -->
  <path d="M232 168 Q224 163 224 173 L224 247 Q224 257 232 252 L291 216 Q299 210 291 204 Z" fill="#FFFFFF"/>

  <!-- Friends watching together -->
  <g fill="url(#people)">
    <!-- left -->
    <circle cx="164" cy="362" r="28"/>
    <path d="M116 432 a48 40 0 0 1 96 0 Z"/>
    <!-- right -->
    <circle cx="348" cy="362" r="28"/>
    <path d="M300 432 a48 40 0 0 1 96 0 Z"/>
  </g>
  <!-- center (front) -->
  <circle cx="256" cy="352" r="34" fill="#E4E7F2" stroke="#1F2334" stroke-width="1"/>
  <path d="M196 440 a60 50 0 0 1 120 0 Z" fill="#E4E7F2" stroke="#1F2334" stroke-width="1" stroke-linejoin="round"/>
</svg>
