[package]
name = "seans"
version = "0.1.0"
description = "Seans Windows media client"
authors = ["tedeshi"]
edition = "2021"
rust-version = "1.77.2"
# Main binary name: seans.exe (set via [[bin]] below)

[lib]
name = "seans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "seans"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = "2"
# M11: seamless updates (check/download/install) + process relaunch.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# CORS-free HTTP from the webview (history / library / search against the API).
tauri-plugin-http = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# JWT storage in the Windows Credential Manager (normal crate dependency).
keyring = { version = "2.3", features = ["platform-windows"] }
# Open the system browser for web OAuth (no plugin permissions needed).
open = "5"
# M7 player: dynamic LoadLibrary of the bundled libmpv-2.dll (local files only).
libloading = "0.8"
# Progressive playback: fetch S3 segments for the local loopback range server.
ureq = { version = "2", default-features = false, features = ["tls"] }
# Win32 child window used as the mpv `wid` render target.
# Registry: discord-{app_id}:// launch registration for the Join button (Discord RPC).
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Graphics_Gdi",
] }
# Discord Rich Presence (IPC named pipe): Listening activity + joinable rooms.
discord-presence = "3.2"
# Main-window HWND for the mpv host (also available via tauri's window handle).
raw-window-handle = "0.6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
